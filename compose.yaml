name: c37-118-simulator

services:
  c37-118-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - run
      - --profile
      - /etc/c37-118/profile.yaml
    volumes:
      - type: bind
        source: ${C37_118_SIMULATOR_PROFILE_SOURCE:-./profiles/five-pmu-v2.yaml}
        target: /etc/c37-118/profile.yaml
        read_only: true
    expose:
      - "4712-4811"
    networks:
      wama-infra:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "c37-118-simulator", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 64m
    pids_limit: 256
    read_only: true
    restart: "no"

networks:
  wama-infra:
    external: true
    name: "${WAMA_INFRA_NETWORK:-wama-infra}"